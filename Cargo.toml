[package]
name = "dns-adblocker"
version = "0.1.0"
edition = "2021"
description = "DNS-level adblocker using Brave's adblock-rust engine"
authors = ["luxder"]

[dependencies]
adblock = { version = "0.13", features = ["debug-info"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
